name: Keep Bancou awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            "https://bancou.app.br/health/"
