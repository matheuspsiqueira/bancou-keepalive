name: Notificações agendadas

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de notificações agendadas
        run: |
          curl -sS --fail-with-body --max-time 120 --retry 2 --retry-delay 20 \
            -X POST "${{ secrets.BANCOU_API_URL }}/api/usuarios/notificacoes/disparar-agendadas/" \
            -H "X-Cron-Secret: ${{ secrets.NOTIFICACOES_CRON_SECRET }}"
